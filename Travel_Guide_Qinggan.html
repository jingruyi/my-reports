<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4b3020">
  <title>青甘大环线旅行攻略</title>
  <style>
:root {
  --ink: #4b3020;
  --ink-deep: #2d1d14;
  --paper: #f6efe2;
  --card: #fffaf2;
  --sand: #c9903f;
  --sand-light: #ead2a7;
  --lake: #9b6a35;
  --lake-light: #f1e2ca;
  --orange: #b75a2e;
  --green: #7d7046;
  --muted: #796b60;
  --border: #e3d5bf;
  --topbar: #342116;
  --hero-start: #3a2418;
  --hero-mid: #76502c;
  --hero-end: #b77a34;
  --hero-glow: rgba(255, 211, 134, .24);
  --body-glow: rgba(218, 174, 104, .34);
  --headline-accent: #e6c884;
  --action-bg: #f3d797;
  --route-dot: #f5d58d;
  --metric-bg: #f5efe5;
  --common-start: rgba(255,253,249,.9);
  --common-end: rgba(244,231,207,.55);
  --shadow: 0 18px 55px rgba(75, 48, 32, .12);
  --radius-lg: 28px;
  --radius-md: 18px;
  --nav-h: 66px;
}

:root[data-theme="harbor-blue"] {
  --ink: #173b4f; --ink-deep: #0b1e2a; --paper: #eef5f7; --card: #fbfeff;
  --sand: #d0a348; --sand-light: #efdcac; --lake: #2a7d83; --lake-light: #d9eff0;
  --orange: #d06b3d; --green: #4f7f68; --muted: #60737b; --border: #d5e2e6;
  --topbar: #102f40; --hero-start: #0c2b3a; --hero-mid: #14536a; --hero-end: #2f858b;
  --hero-glow: rgba(111,210,216,.2); --body-glow: rgba(102,180,190,.22); --headline-accent: #f0cf7b;
  --action-bg: #f4d98f; --route-dot: #f4d98f; --metric-bg: #edf4f5;
  --common-start: rgba(251,254,255,.92); --common-end: rgba(218,238,239,.62);
  --shadow: 0 18px 55px rgba(15, 54, 72, .12);
}

:root[data-theme="island-turquoise"] {
  --ink: #16484d; --ink-deep: #0b2f34; --paper: #edf9f7; --card: #fbfffe;
  --sand: #e0a94d; --sand-light: #f4dfaf; --lake: #168e91; --lake-light: #d5f3f0;
  --orange: #d96f45; --green: #43856b; --muted: #5f7775; --border: #cfe4e1;
  --topbar: #103a40; --hero-start: #0d3a43; --hero-mid: #16747a; --hero-end: #3db4aa;
  --hero-glow: rgba(151,238,224,.23); --body-glow: rgba(69,183,166,.2); --headline-accent: #ffda91;
  --action-bg: #ffe0a3; --route-dot: #ffe0a3; --metric-bg: #e9f5f2;
  --common-start: rgba(251,255,254,.94); --common-end: rgba(211,241,235,.65);
  --shadow: 0 18px 55px rgba(16, 79, 78, .12);
}

:root[data-theme="mountain-green"] {
  --ink: #29483a; --ink-deep: #15291f; --paper: #f1f5ed; --card: #fcfff9;
  --sand: #b68a4c; --sand-light: #e5d2ad; --lake: #4f8068; --lake-light: #dcebe2;
  --orange: #b9633f; --green: #50795b; --muted: #68776c; --border: #d7e0d2;
  --topbar: #213b2f; --hero-start: #1c3429; --hero-mid: #3f6752; --hero-end: #7c8a55;
  --hero-glow: rgba(211,222,151,.2); --body-glow: rgba(147,177,128,.2); --headline-accent: #dfc989;
  --action-bg: #e8d49a; --route-dot: #e8d49a; --metric-bg: #edf2e9;
  --common-start: rgba(252,255,249,.94); --common-end: rgba(226,236,216,.68);
  --shadow: 0 18px 55px rgba(39, 71, 54, .12);
}

:root[data-theme="heritage-red"] {
  --ink: #2d2a26; --ink-deep: #1a1815; --paper: #faf8f4; --card: #ffffff;
  --sand: #bf9463; --sand-light: #ece2d0; --lake: #6b7d70; --lake-light: #e7ede8;
  --orange: #b06a4a; --green: #6f8268; --muted: #8b8177; --border: #e6e1d8;
  --topbar: #7a4530; --hero-start: #8a4a2e; --hero-mid: #bf7b42; --hero-end: #e0b876;
  --hero-glow: rgba(230,210,170,.14); --body-glow: rgba(200,180,140,.12); --headline-accent: #ddceac;
  --action-bg: #ece2cd; --route-dot: #ece2cd; --metric-bg: #f6f3ee;
  --common-start: rgba(255,255,255,.95); --common-end: rgba(240,235,225,.6);
  --shadow: 0 18px 55px rgba(30, 28, 24, .09);
}

:root[data-theme="snow-blue"] {
  --ink: #29475c; --ink-deep: #152b3a; --paper: #f1f6f9; --card: #fbfdff;
  --sand: #83a9c2; --sand-light: #d2e3ed; --lake: #4f85a6; --lake-light: #dcebf3;
  --orange: #c46f55; --green: #5d857c; --muted: #6d7d88; --border: #d5e1e8;
  --topbar: #203b4f; --hero-start: #183246; --hero-mid: #3d6d89; --hero-end: #88afc4;
  --hero-glow: rgba(220,244,255,.24); --body-glow: rgba(156,200,221,.2); --headline-accent: #d7ecf4;
  --action-bg: #d9edf5; --route-dot: #d9edf5; --metric-bg: #edf3f7;
  --common-start: rgba(251,253,255,.95); --common-end: rgba(221,235,244,.68);
  --shadow: 0 18px 55px rgba(35, 70, 92, .12);
}

:root[data-theme="city-night"] {
  --ink: #302b52; --ink-deep: #171429; --paper: #f3f1f7; --card: #fdfcff;
  --sand: #a982ca; --sand-light: #e3d6ef; --lake: #596db0; --lake-light: #e0e5f5;
  --orange: #c96982; --green: #587d77; --muted: #706d7d; --border: #ded9e7;
  --topbar: #201c38; --hero-start: #1a1732; --hero-mid: #3e376c; --hero-end: #6c5793;
  --hero-glow: rgba(210,184,244,.22); --body-glow: rgba(159,137,203,.18); --headline-accent: #ddc4f0;
  --action-bg: #dec8ef; --route-dot: #dec8ef; --metric-bg: #efedf5;
  --common-start: rgba(253,252,255,.95); --common-end: rgba(230,223,241,.68);
  --shadow: 0 18px 55px rgba(43, 37, 79, .13);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink-deep);
  background:
    radial-gradient(circle at 12% 20%, var(--body-glow), transparent 30%),
    var(--paper);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.7;
}
button, a { font: inherit; }
a { color: inherit; text-decoration: none; }
button { color: inherit; }

.reading-progress {
  position: fixed; z-index: 100; left: 0; top: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--sand), var(--action-bg), var(--lake));
}
.topbar {
  position: fixed; z-index: 90; top: 0; left: 0; right: 0; height: var(--nav-h);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px;
  padding: 0 max(22px, calc((100vw - 1180px) / 2));
  color: white; background: color-mix(in srgb, var(--topbar) 95%, transparent); backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,.09);
}
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: .04em; }
.brand-mark {
  display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
  color: var(--ink-deep); background: linear-gradient(135deg, var(--action-bg), var(--sand));
}
.primary-nav { display: flex; align-items: center; gap: 28px; color: rgba(255,255,255,.78); font-size: .92rem; }
.primary-nav a:hover { color: white; }

.hero {
  position: relative; min-height: 520px; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr); align-items: center; gap: 20px;
  color: white; padding: 76px max(28px, calc((100vw - 1180px) / 2));
  background:
    radial-gradient(circle at 78% 18%, var(--hero-glow), transparent 26%),
    linear-gradient(120deg, var(--hero-start), var(--hero-mid) 54%, var(--hero-end) 100%);
  border-radius: 0 0 44px 44px;
}
.hero::after {
  content: "ROUTE 01"; position: absolute; right: 5%; bottom: -34px;
  font: 800 8rem/1 Georgia, serif; letter-spacing: -.04em; color: rgba(255,255,255,.055);
}
.hero-glow { position: absolute; border-radius: 50%; filter: blur(4px); }
.hero-glow-one { width: 340px; height: 340px; right: 9%; top: -150px; background: color-mix(in srgb, var(--action-bg) 24%, transparent); }
.hero-glow-two { width: 260px; height: 260px; left: 43%; bottom: -170px; background: color-mix(in srgb, var(--sand) 28%, transparent); }
.hero-content { position: relative; z-index: 2; max-width: 720px; }
.eyebrow, .section-kicker { margin: 0 0 10px; color: var(--headline-accent); font-size: .76rem; font-weight: 800; letter-spacing: .22em; }
.hero h1 { margin: 0; font: 800 clamp(2.7rem, 5vw, 5rem)/1.08 Georgia, "Songti SC", serif; letter-spacing: -.03em; }
.hero-subtitle { max-width: 660px; margin: 22px 0 0; color: rgba(255,255,255,.78); font-size: 1.08rem; }
.hero-actions { display: flex; gap: 12px; margin-top: 32px; }
.primary-action, .secondary-action {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 46px;
  border-radius: 999px; padding: 0 20px; cursor: pointer;
}
.primary-action { color: var(--ink-deep); background: var(--action-bg); font-weight: 750; }
.secondary-action { color: white; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.24); }
.hero-tags { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 28px; }
.hero-tags span { padding: 7px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(255,255,255,.08); font-size: .82rem; }
.hero-date { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); color: white; font-size: .92rem; font-weight: 600; letter-spacing: .02em; }
.hero-route { position: relative; z-index: 1; min-height: 340px; }
.route-map-word {
  position: absolute; inset: 52px 22px auto auto; font: 800 7rem/1 Georgia, serif;
  color: rgba(255,255,255,.08); letter-spacing: -.08em;
}
.route-orbit { position: absolute; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; transform: rotate(-14deg); }
.route-orbit-one { width: 360px; height: 190px; right: 0; top: 74px; }
.route-orbit-two { width: 280px; height: 280px; right: 38px; top: 32px; }
.route-city { position: absolute; display: flex; align-items: center; gap: 8px; font-size: .82rem; color: rgba(255,255,255,.82); }
.route-city .route-dot { width: 10px; height: 10px; border: 2px solid var(--route-dot); border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 6px color-mix(in srgb, var(--route-dot) 14%, transparent); }
.route-city .route-label { width: auto; height: auto; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.route-city-a { right: 76px; top: 55px; }
.route-city-b { right: 292px; top: 136px; }
.route-city-c { right: 22px; top: 235px; }
.route-city-d { right: 230px; top: 300px; }

.quick-strip {
  position: relative; z-index: 5; width: min(1120px, calc(100% - 32px)); margin: -32px auto 0;
  display: grid; grid-template-columns: repeat(5, 1fr); overflow: hidden;
  background: var(--card); border: 1px solid rgba(228,221,208,.9); border-radius: 20px; box-shadow: var(--shadow);
}
.quick-item { padding: 20px 22px; border-right: 1px solid var(--border); }
.quick-item:last-child { border-right: 0; }
.quick-item span { display: block; color: var(--muted); font-size: .76rem; }
.quick-item strong { display: block; margin-top: 2px; font-size: .94rem; }

.page-shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 66px 0 100px; }
.section-block { scroll-margin-top: calc(var(--nav-h) + 24px); margin-bottom: 80px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
.section-heading h2 { margin: 0; font: 800 2.1rem/1.15 Georgia, "Songti SC", serif; color: var(--ink); }
.section-note { color: var(--muted); font-size: .86rem; }
.overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.overview-card { position: relative; overflow: hidden; min-height: 245px; padding: 26px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(23,59,79,.06); }
.overview-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent); }
.tone-blue { --accent: #6d7d78; }
.tone-gold { --accent: var(--sand); }
.tone-green { --accent: var(--green); }
.overview-card-top { display: flex; justify-content: space-between; align-items: center; }
.card-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, white); color: var(--accent); font-size: 1.25rem; font-weight: 800; }
.overview-card h3 { margin: 24px 0 8px; font-size: 1.22rem; }
.overview-card p { margin: 0; color: #4a4640; }
.overview-card footer { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); color: var(--muted); font-size: .82rem; }
.module-section { padding: 34px; border: 1px solid rgba(228,221,208,.92); border-radius: 24px; background: rgba(255,253,249,.58); }
.common-section { padding: 34px; border: 1px solid var(--border); border-radius: 24px; background: linear-gradient(145deg, var(--common-start), var(--common-end)); }
.common-module-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.common-card { border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,.88); overflow: hidden; }
.common-card.wide { grid-column: 1 / -1; }
.common-card summary { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 13px; min-height: 92px; padding: 17px 18px; cursor: pointer; list-style: none; }
.common-card summary::-webkit-details-marker { display: none; }
.common-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; color: #fff8e8; background: var(--ink); font-weight: 800; }
.common-title strong, .common-title small { display: block; }
.common-title strong { color: var(--ink); font-size: 1rem; }
.common-title small { margin-top: 3px; color: var(--muted); font-size: .76rem; line-height: 1.5; }
.common-card ul { margin: 0; padding: 0 24px 20px 75px; color: #4a4640; font-size: .84rem; line-height: 1.7; }
.common-card li + li { margin-top: 5px; }
.common-card[open] { box-shadow: 0 10px 30px rgba(77,48,31,.07); }
.module-catalog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.catalog-card { display: grid; grid-template-columns: 46px 1fr; gap: 14px; min-height: 150px; padding: 18px; border: 1px solid var(--border); border-radius: 15px; background: var(--card); }
.catalog-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: white; background: var(--lake); font-weight: 800; }
.catalog-card.attention .catalog-icon { background: var(--sand); }
.catalog-card.disabled { opacity: .48; filter: grayscale(.35); }
.catalog-state { color: var(--orange); font-size: .7rem; font-weight: 800; }
.catalog-card h3 { margin: 2px 0 4px; font-size: 1rem; }
.catalog-card p { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }
.status { display: inline-flex; align-items: center; width: fit-content; white-space: nowrap; padding: 4px 9px; border-radius: 999px; font-size: .7rem; font-weight: 750; }
.status.confirmed { color: #27624b; background: #e2f1e9; }
.status.suggested { color: #8a5b19; background: #f8ecd2; }
.status.pending { color: #9b4938; background: #fae5df; }
.status.recheck { color: #315f7a; background: #e1edf4; }

.day-selector { width: min(720px, 100%); display: grid; grid-template-columns: 38px minmax(0, 1fr) 38px; align-items: center; gap: 8px; }
.day-selector.short-trip { width: auto; grid-template-columns: minmax(0, 1fr); }
.day-tab-rail { display: flex; gap: 8px; min-width: 0; overflow-x: auto; padding: 3px 2px 5px; scrollbar-width: none; scroll-snap-type: x proximity; }
.day-tab-rail::-webkit-scrollbar { display: none; }
.day-tab { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
.day-tab { flex: 0 0 auto; scroll-snap-align: center; }
.day-tab strong { color: var(--ink); }
.day-tab span { color: #6b6258; font-size: .78rem; }
.day-tab em { padding: 2px 5px; border-radius: 999px; color: #fff5dc; background: var(--orange); font-size: .62rem; font-style: normal; }
.day-tab.active { color: white; background: var(--orange); border-color: var(--orange); }
.day-tab.active strong { color: #fff; }
.day-tab.active span { color: rgba(255,255,255,.7); }
.day-arrow { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--ink); font-size: 1.45rem; cursor: pointer; }
.day-arrow:disabled, .day-footer-nav button:disabled { opacity: .3; cursor: not-allowed; }
.day-migration-note { grid-column: 1 / -1; justify-self: end; color: var(--muted); font-size: .72rem; }
.day-card { scroll-margin-top: calc(var(--nav-h) + 20px); overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.day-card[hidden] { display: none !important; }
.day-card-header { display: grid; grid-template-columns: 130px 1fr; align-items: stretch; color: white; background: var(--ink); }
.day-index { display: flex; flex-direction: column; justify-content: center; padding: 24px 26px; background: rgba(255,255,255,.055); }
.day-index span { font: 800 2.4rem/1 Georgia, serif; color: var(--action-bg); }
.day-index small { margin-top: 7px; color: rgba(255,255,255,.62); }
.day-title-block { padding: 24px 28px; }
.day-title-line { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.65); font-size: .82rem; }
.day-title-block h3 { margin: 8px 0 0; font: 800 2rem/1.15 Georgia, "Songti SC", serif; }
.metric-row { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--metric-bg); border-bottom: 1px solid var(--border); }
.metric-row > div { padding: 18px 22px; border-right: 1px solid var(--border); }
.metric-row > div:last-child { border-right: 0; }
.metric-row span { display: block; color: var(--muted); font-size: .72rem; }
.metric-row strong { display: block; margin-top: 2px; }
.day-body { display: grid; grid-template-columns: minmax(290px, .78fr) minmax(0, 1.5fr); gap: 26px; padding: 30px; }
.day-side { display: flex; flex-direction: column; gap: 18px; }
.alert-box { padding: 18px; border-radius: 14px; border-left: 4px solid var(--alert); background: color-mix(in srgb, var(--alert) 10%, white); }
.alert-yellow { --alert: #c2984f; }
.alert-orange { --alert: #b06a4a; }
.alert-blue { --alert: #4f7089; }
.alert-box p { margin: 4px 0 0; color: #4a463f; font-size: .88rem; }
.transport-panel, .timeline-panel { border: 1px solid var(--border); border-radius: 16px; background: white; }
.transport-panel { padding: 20px; }
.transport-panel h4, .panel-title h4 { margin: 0; color: var(--ink); }
.transport-line { display: grid; grid-template-columns: 36px 1fr; gap: 12px; margin-top: 18px; }
.transport-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: var(--lake); background: var(--lake-light); font-size: .76rem; font-weight: 800; }
.transport-line strong, .transport-line span, .transport-line small { display: block; }
.transport-line strong { font-size: .87rem; }
.transport-line span { color: var(--orange); font-size: .8rem; }
.transport-line small { color: var(--muted); font-size: .74rem; }
.timeline-panel { padding: 22px 24px; }
.panel-title { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.panel-title span { color: var(--muted); font-size: .75rem; }
.timeline { list-style: none; margin: 0; padding: 12px 0 0; }
.timeline li { position: relative; display: grid; grid-template-columns: 76px 1fr; gap: 16px; padding: 12px 0 12px 22px; border-left: 2px solid #e6dfd3; }
.timeline li::before { content: ""; position: absolute; width: 10px; height: 10px; left: -6px; top: 20px; border-radius: 50%; background: #c5b9a6; border: 2px solid white; box-shadow: 0 0 0 1px #c5b9a6; }
.timeline li.timeline-key::before { background: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.timeline li.timeline-rest::before { background: var(--green); box-shadow: 0 0 0 1px var(--green); }
.timeline time { color: var(--orange); font-weight: 800; font-size: .86rem; }
.timeline strong { display: block; }
.timeline p { margin: 2px 0 0; color: #6b6258; font-size: .85rem; }
.module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 30px 30px; }
.day-footer-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-top: 18px; }
.day-footer-nav button { width: fit-content; min-height: 42px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--ink); cursor: pointer; }
.day-footer-nav button:last-child { justify-self: end; }

.task-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.validation-item.pass .validation-icon { color: #d5f3df; background: rgba(79,127,104,.48); }

.validation-item p { margin: 3px 0 0; color: rgba(255,255,255,.6); font-size: .76rem; line-height: 1.55; }
.task-card { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 22px; border: 1px dashed #cdbfa9; border-radius: 16px; background: rgba(255,253,249,.72); cursor: pointer; transition: .18s ease; }
.task-card:hover { transform: translateY(-2px); border-color: var(--sand); background: var(--card); }
.task-check { position: absolute; opacity: 0; pointer-events: none; }
.task-check-wrap { position: relative; padding-top: 2px; }
.task-check-ui { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid #cdbfa9; border-radius: 9px; color: transparent; background: white; transition: .18s ease; }
.task-check:focus-visible + .task-check-ui { outline: 3px solid rgba(42,125,131,.24); }

.task-content { display: block; }

.status-dialog { width: min(520px, calc(100% - 28px)); border: 0; border-radius: 24px; padding: 34px; color: var(--ink-deep); box-shadow: 0 30px 100px rgba(11,30,42,.35); }

window.TRIP_DATA.days.forEach((day) => day.modules.forEach((module) => {
  if (module.type === "shopping" && shoppingCards[day.id]) module.items = shoppingCards[day.id];
}));

// 成品文案清理：隐藏调研来源口吻，只保留直接可执行的信息。
const sourcePhrases = [
  "作者实吃｜", "本篇美食清单新增｜", "评论区候选｜", "本篇评论新增｜", "本篇评论型店铺线索｜",
  "本篇新增正餐候选｜", "本篇口味与点单提醒｜", "评论价格线索｜", "通用候选｜", "本篇候选｜",
  "本篇新增｜", "笔记称", "笔记作者", "作者认为", "作者回忆", "作者称", "评论中作者回忆",
  "评论中", "评论有人", "评论称", "评论提示", "评论补充", "网友询价基准（未核实）｜",
  "来源提到", "平台交叉核对｜", "单篇笔记称", "一篇近期体验称", "一篇近期笔记称",
  "一篇实购笔记认为", "有笔记推荐", "笔记提到", "笔记记录", "近期个人体验称"
];
function cleanDisplayText(value) {
  if (typeof value !== "string") return value;
  return sourcePhrases.reduce((text, phrase) => text.split(phrase).join(""), value)
    .replace(/（未核实）/g, "")
    .replace(/（非统一价）/g, "")
    .replace(/作者回忆约/g, "约")
    .replace(/评论对[^。；]+分歧较大；?/g, "")
    .replace(/评论未提供交叉支持/g, "")
    .trim();
}
function cleanDisplayObject(value) {
  if (Array.isArray(value)) return value.map(cleanDisplayObject).filter((item) => item !== "");
  if (value && typeof value === "object") {
    Object.keys(value).forEach((key) => { value[key] = cleanDisplayObject(value[key]); });
    return value;
  }
  return cleanDisplayText(value);
}
cleanDisplayObject(window.TRIP_DATA.overview);
cleanDisplayObject(window.TRIP_DATA.commonModules);
cleanDisplayObject(window.TRIP_DATA.days);
cleanDisplayObject(window.TRIP_DATA.tasks);
// V2 页面路由展示字段。
window.TRIP_DATA.meta.route = {label: "青甘环线", cities: ["西宁", "张掖", "敦煌", "青海湖"]};
window.TRIP_DATA.meta.dialogText = "这份青甘攻略以 10 天环线为主线；莫高窟票务已确认，Day 5 演出与 Day 9 盐湖分支按实际情况更新。";


</script>
  <script>
(function () {
  if ("scrollRestoration" in history) { history.scrollRestoration = "manual"; }
  window.scrollTo(0, 0);
  const data = window.TRIP_DATA;
  const $ = (selector) => document.querySelector(selector);
  const TASK_KEY = "travel-guide-completed-tasks";
  const AVAILABLE_THEMES = ["desert-gold", "harbor-blue", "island-turquoise", "mountain-green", "heritage-red", "snow-blue", "city-night"];
  const ICONS = {
    日期: "📅", 同行: "👥", 交通: "🚄", 预算: "💰", 状态: "📌",
    交: "🚄", 线: "🧭", 住: "🏨", 食: "🍲", 包: "🧳", 雨: "🌧️", 约: "📋", 核: "🪪",
    城: "🏙️", 车: "🚕", 高: "🏔️", 岛: "🏝️", 外: "🌍", 亲: "👨‍👩‍👧‍👦", 摄: "📷", 步: "🚶",
    大交通: "🚄", 住宿: "🏨", 总路线: "🧭", 天气: "⛅", 美食: "🍲", 行李: "🧳", 应急: "⚠️",
    伴: "👥", 备: "🧴", 摆: "🚌", 衣: "🧥", 补: "🧃", 购: "🛍️", 预约: "📋", 飞: "✈️", 点: "🔍", 命: "♾️", 食: "🥢"
  };
  const iconFor = (value) => ICONS[value] || value;

  function formatItem(text) {
    const barIndex = String(text).indexOf("｜");
    if (barIndex > -1) {
      const label = String(text).slice(0, barIndex);
      const rest = String(text).slice(barIndex + 1);
      return `<b class="item-label">${label}</b>｜${rest}`;
    }
    return String(text);
  }

  function applyTheme() {
    const requestedTheme = data.meta.theme || "desert-gold";
    const theme = AVAILABLE_THEMES.includes(requestedTheme) ? requestedTheme : "desert-gold";
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.themeLabel = data.meta.themeLabel || "目的地主题";
    const themeColor = getComputedStyle(document.documentElement).getPropertyValue("--topbar").trim();
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    if (themeMeta && themeColor) themeMeta.setAttribute("content", themeColor);
  }

  const status = (text, type) => `<span class="status ${type}">${text}</span>`;

  function parseLocalDate(isoDate) {
    const [year, month, day] = isoDate.split("-").map(Number);
    return new Date(year, month - 1, day);
  }

  function toLocalISO(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function resolveCalendarContext() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const todayISO = toLocalISO(today);
    const start = parseLocalDate(data.meta.startDate);
    const end = parseLocalDate(data.meta.endDate);
    const exactIndex = data.days.findIndex((day) => day.isoDate === todayISO);
    let initialIndex = 0;

    if (exactIndex >= 0) {
      initialIndex = exactIndex;
    } else if (today > end) {
      initialIndex = data.days.length - 1;
    } else if (today >= start) {
      const previousMigratedDays = data.days
        .map((day, index) => ({index, date: parseLocalDate(day.isoDate)}))
        .filter((item) => item.date <= today);
      initialIndex = previousMigratedDays.length ? previousMigratedDays[previousMigratedDays.length - 1].index : 0;
    }

    return {today, todayISO, start, end, exactIndex, initialIndex};
  }

  const calendarContext = resolveCalendarContext();

  function renderMeta() {
    $("#trip-kicker").textContent = data.meta.kicker;
    $("#trip-title").textContent = data.meta.title;
    $("#trip-subtitle").textContent = data.meta.subtitle;
    $("#hero-tags").innerHTML = data.tags.map((tag) => `<span>${tag}</span>`).join("");

    $("#hero-date").innerHTML = `<span aria-hidden="true">${iconFor("日期")}</span><span>${data.meta.dates}</span>`;

    const route = data.meta.route || {};
    $("#route-map-word").textContent = route.label || data.meta.themeLabel || "旅程";
    ["a", "b", "c", "d"].forEach((key) => {
      const node = $("#route-city-" + key);
      if (node) node.textContent = (route.cities || [])["abcd".indexOf(key)] || "";
    });
  }

  function renderOverview() {
    const overviewGrid = $("#overview-grid");
    if (!overviewGrid) return;
    overviewGrid.innerHTML = data.overview.map((item) => `
      <article class="overview-card tone-${item.tone}">
        <div class="overview-card-top">
          <span class="card-icon">${iconFor(item.icon)}</span>
          ${status(item.status, item.statusType)}
        </div>
        <h3>${item.title}</h3>
        <p>${item.body}</p>
        <footer>${item.foot}</footer>
      </article>
    `).join("");
  }

  function renderCommonModules() {
    const commonGrid = $("#common-module-grid");
    if (!commonGrid) return;
      commonGrid.innerHTML = data.commonModules.map((module) => `
      <details class="common-card ${module.wide ? "wide" : ""}" data-common-id="${module.id}">
        <summary>
          <span class="common-icon">${iconFor(module.icon)}</span>
          <span class="common-title"><strong>${module.title}</strong></span>
        </summary>
        ${Array.isArray(module.categories)
          ? `<div class="common-categories">${module.categories.map((category) => `
              <div class="common-category">
                <strong class="common-category-title common-tone-${category.tone || "default"}">${category.title}</strong>
                <ul>${category.items.map((item) => `<li>${formatItem(item)}</li>`).join("")}</ul>
              </div>
            `).join("")}</div>`
          : `<ul>${module.items.map((item) => `<li>${formatItem(item)}</li>`).join("")}</ul>`}
      </details>
    `).join("");
  }

  function renderModuleCatalog() {
    const catalog = $("#module-catalog");
    if (!catalog) return;
    const enabledModules = data.destinationModules.filter((module) => module.enabled);
    const count = $("#module-count");
    if (count) count.textContent = `本次启用 ${enabledModules.length} / ${data.destinationModules.length} 个可选模块`;
    catalog.innerHTML = enabledModules.map((module) => `
        <article class="catalog-card enabled">
          <span class="catalog-icon">${iconFor(module.icon)}</span>
          <div><span class="catalog-state">已启用</span><h3>${module.name}</h3><p>${module.text}</p></div>
        </article>
      `).join("");
  }

  function renderDays() {
    const pagedDays = data.expectedDayCount > 3;
    const missingDays = Math.max(0, data.expectedDayCount - data.days.length);
    const tabs = data.days.map((day, index) => `
      <button class="day-tab ${index === 0 ? "active" : ""} ${day.isoDate === calendarContext.todayISO ? "is-today" : ""}" data-day-index="${index}" type="button" role="tab" aria-selected="${index === 0}">
        <strong>${day.short}</strong><span>${day.date}</span>${day.isoDate === calendarContext.todayISO ? "<em>今天</em>" : ""}
      </button>
    `).join("");
    $("#day-selector").classList.toggle("short-trip", !pagedDays);
    $("#day-selector").innerHTML = pagedDays ? `
        <button class="day-arrow" id="day-prev" type="button" aria-label="上一天" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <div class="day-tab-rail" role="tablist">${tabs}</div>
        <button class="day-arrow" id="day-next" type="button" aria-label="下一天" ${data.days.length < 2 ? "disabled" : ""}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        <span class="day-migration-note" id="day-progress-label">已接入 ${data.days.length}/${data.expectedDayCount} 天${missingDays ? ` · 其余 ${missingDays} 天待迁移` : ""}</span>
      ` : `
        <div class="day-tab-rail" role="tablist">${tabs}</div>
        <span class="day-migration-note" id="day-progress-label">${data.expectedDayCount} 天短途行程 · 连续展开</span>
      `;

    $("#day-list").innerHTML = data.days.map((day, index) => `
      <article class="day-card" id="${day.id}" data-day-index="${index}" ${pagedDays && index > 0 ? "hidden" : ""}>
        <header class="day-card-header">
          <div class="day-index"><span>${day.short}</span><small>${day.date}</small></div>
          <div class="day-title-block">
            <div class="day-title-line"><span>${day.theme}</span></div>
            <h3>${day.title}</h3>
          </div>
        </header>
        <div class="metric-row">
          ${day.metrics.map((item) => `<div><span>${item.label}</span><strong>${item.value}</strong></div>`).join("")}
        </div>
        <div class="day-body">
          <aside class="day-side">
            <div class="alert-box alert-${day.alert.tone}">
              <strong>${day.alert.title}</strong><p>${day.alert.text}</p>
            </div>
            <div class="transport-panel">
              <h4>🚕 交通接驳</h4>
              ${day.transport.map((item) => `
                <div class="transport-line">
                  <span class="transport-icon">${iconFor(item.icon)}</span>
                  <div><strong>${item.route}</strong><span>${item.time}</span><small>${item.note}</small></div>
                </div>
              `).join("")}
            </div>
          </aside>
          <div class="timeline-panel">
            <div class="panel-title"><h4>🕘 今日时间轴</h4><span>关键节点优先</span></div>
            <ol class="timeline">
              ${day.timeline.map((item) => `
                <li class="timeline-${item.level}"><time>${item.time}</time><div><strong>${item.title}</strong><p>${item.text}</p></div></li>
              `).join("")}
            </ol>
          </div>
        </div>
        <div class="module-grid">
          ${day.modules.map((module) => `
            <details class="detail-card ${module.type}">
              <summary><span class="detail-icon">${iconFor(module.icon)}</span><span><strong>${module.title}</strong></span></summary>
              <ul>${module.items.map((item) => `<li>${formatItem(item)}</li>`).join("")}</ul>
            </details>
          `).join("")}
        </div>
      </article>
    `).join("");

    $("#day-footer-nav").hidden = !pagedDays;
    $("#day-footer-nav").innerHTML = pagedDays ? `
      <button id="day-footer-prev" type="button" disabled><span>←</span> 上一天</button>
      <span id="day-footer-status">第 1 / ${data.expectedDayCount} 天</span>
      <button id="day-footer-next" type="button" ${data.days.length < 2 ? "disabled" : ""}>下一天 <span>→</span></button>
    ` : "";
  }

  function showDay(index, moveToSection) {
    const pagedDays = data.expectedDayCount > 3;
    const safeIndex = Math.max(0, Math.min(index, data.days.length - 1));
    document.querySelectorAll(".day-card").forEach((card, cardIndex) => {
      card.hidden = pagedDays && cardIndex !== safeIndex;
    });
    document.querySelectorAll(".day-tab").forEach((tab, tabIndex) => {
      const active = tabIndex === safeIndex;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      if (active) tab.scrollIntoView({behavior: "smooth", block: "nearest", inline: "center"});
    });

    if (pagedDays) {
      const atStart = safeIndex === 0;
      const atEnd = safeIndex === data.days.length - 1;
      $("#day-prev").disabled = atStart;
      $("#day-next").disabled = atEnd;
      $("#day-footer-prev").disabled = atStart;
      $("#day-footer-next").disabled = atEnd;
      $("#day-progress-label").textContent = `第 ${safeIndex + 1} / ${data.expectedDayCount} 天 · ${data.days[safeIndex].title}`;
      $("#day-footer-status").textContent = `第 ${safeIndex + 1} / ${data.expectedDayCount} 天`;
    }
    document.body.dataset.activeDay = String(safeIndex);
    if (moveToSection) {
      const target = pagedDays ? $("#days") : document.querySelector(`.day-card[data-day-index="${safeIndex}"]`);
      target.scrollIntoView({behavior: "smooth", block: "start"});
    }
  }

  function renderTasks() {
    const taskGrid = $("#task-grid");
    if (!taskGrid) return;
    const completed = JSON.parse(localStorage.getItem(TASK_KEY) || "[]");
    taskGrid.innerHTML = data.tasks.map((task, index) => `
      <label class="task-card ${completed.includes(index) ? "completed" : ""}">
        <span class="task-check-wrap">
          <input class="task-check" type="checkbox" data-task-index="${index}" ${completed.includes(index) ? "checked" : ""}>
          <span class="task-check-ui" aria-hidden="true">✓</span>
        </span>
        <span class="task-content">
          ${status(task.status, task.type)}
          <strong>${task.title}</strong>
          <small>${task.text}</small>
        </span>
      </label>
    `).join("");
  }

  function parseMinutes(value) {
    const match = String(value).match(/^(\d{1,2}):(\d{2})/);
    return match ? Number(match[1]) * 60 + Number(match[2]) : null;
  }

  function getValidationResults() {
    const results = [];
    const missingDays = Math.max(0, data.expectedDayCount - data.days.length);
    results.push({
      severity: missingDays ? "pending" : "pass",
      title: missingDays ? `还有 ${missingDays} 天尚未接入母版` : "每日行程已全部接入",
      text: `当前已整理 ${data.days.length} / ${data.expectedDayCount} 天；未接入内容不会被视为缺失或删除。`
    });

    const pendingLodging = data.days.filter((day) => day.modules.some((module) => module.type === "lodging" && module.statusType === "pending"));
    results.push({
      severity: pendingLodging.length ? "pending" : "pass",
      title: pendingLodging.length ? `${pendingLodging.length} 天住宿信息待补充` : "住宿信息完整",
      text: pendingLodging.length ? `${pendingLodging.map((day) => day.short).join("、")} 仍需填写酒店、地址、电话、订单和取消规则。` : "已具备旅途中查找所需信息。"
    });

    const pendingTransport = data.days.flatMap((day) => day.transport.filter((item) => /待确认/.test(item.note)).map(() => day.short));
    results.push({
      severity: pendingTransport.length ? "recheck" : "pass",
      title: pendingTransport.length ? `${pendingTransport.length} 项交通信息待确认` : "交通信息已确认",
      text: pendingTransport.length ? `${[...new Set(pendingTransport)].join("、")} 的司机、车型或接驳信息仍需补齐。` : "当前交通信息无明显缺口。"
    });

    const timelineIssues = data.days.filter((day) => {
      const times = day.timeline.map((item) => parseMinutes(item.time)).filter((item) => item !== null);
      return times.some((time, index) => index > 0 && time < times[index - 1]);
    });
    results.push({
      severity: timelineIssues.length ? "warning" : "pass",
      title: timelineIssues.length ? "发现时间轴顺序异常" : "已接入日期的时间轴顺序正常",
      text: timelineIssues.length ? `${timelineIssues.map((day) => day.short).join("、")} 需要重新检查开始时间。` : "Day 1—2 暂未发现前后时间倒置。"
    });

    return [...data.knownIssues, ...results];
  }

  function renderValidation() {
    if (!$("#validation-summary") || !$("#validation-list")) return;
    const results = getValidationResults();
    const unresolved = results.filter((item) => item.severity !== "pass").length;
    $("#validation-summary").innerHTML = `
      <div><strong>${unresolved}</strong><span>项待处理</span></div>
      <p>这部分用于区分“攻略还没写完”和“行程本身有冲突”。后续每次补充内容都会重新检查。</p>
    `;
    const icons = {warning: "!", pending: "…", recheck: "↻", pass: "✓"};
    $("#validation-list").innerHTML = results.map((item) => `
      <article class="validation-item ${item.severity}">
        <span class="validation-icon">${icons[item.severity]}</span>
        <div><strong>${item.title}</strong><p>${item.text}</p></div>
      </article>
    `).join("");
  }

  function bindInteractions() {
    const body = document.body;

    document.querySelectorAll(".day-tab").forEach((button) => {
      button.addEventListener("click", () => {
        showDay(Number(button.dataset.dayIndex), data.expectedDayCount <= 3);
      });
    });
    if (data.expectedDayCount > 3) {
      $("#day-prev").addEventListener("click", () => showDay(Number(body.dataset.activeDay || 0) - 1, false));
      $("#day-next").addEventListener("click", () => showDay(Number(body.dataset.activeDay || 0) + 1, false));
      $("#day-footer-prev").addEventListener("click", () => showDay(Number(body.dataset.activeDay || 0) - 1, true));
      $("#day-footer-next").addEventListener("click", () => showDay(Number(body.dataset.activeDay || 0) + 1, true));
    }

    document.querySelectorAll(".task-check").forEach((checkbox) => {
      checkbox.addEventListener("change", () => {
        const checked = [...document.querySelectorAll(".task-check:checked")].map((item) => Number(item.dataset.taskIndex));
        localStorage.setItem(TASK_KEY, JSON.stringify(checked));
        checkbox.closest(".task-card").classList.toggle("completed", checkbox.checked);
      });
    });

    const backTop = $("#back-top");
    window.addEventListener("scroll", () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      $("#reading-progress").style.width = `${max > 0 ? window.scrollY / max * 100 : 0}%`;
      backTop.classList.toggle("visible", window.scrollY > 500);
    }, {passive: true});
    backTop.addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
    showDay(calendarContext.initialIndex, false);
  }

  applyTheme();
  renderMeta();
  renderOverview();
  renderCommonModules();
  renderModuleCatalog();
  renderDays();
  renderValidation();
  renderTasks();
  bindInteractions();
  window.scrollTo(0, 0);
  window.addEventListener("load", () => window.scrollTo(0, 0));
})();

</script>
</body>
</html>
